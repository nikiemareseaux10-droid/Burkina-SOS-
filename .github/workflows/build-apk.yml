name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: |
          mkdir -p lib
          [ -f main.dart ] && mv main.dart lib/main.dart || true
          mkdir /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --org bf.burkinasos --project-name burkina_sos --platforms=android .
          rm -rf lib test && cp -r /tmp/keep/lib lib && cp /tmp/keep/pubspec.yaml pubspec.yaml
      - name: Permissions et nom
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Burkina SOS"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application#' $M
      - name: Icône de l’application
        run: |
          flutter pub add --dev flutter_launcher_icons
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "icon.png"\n' > flutter_launcher_icons.yaml
          dart run flutter_launcher_icons
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: burkina-sos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
